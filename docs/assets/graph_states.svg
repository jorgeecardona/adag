.dag--band .dag-item--step.is-leaf .dag-tab { stroke: #9fa8da; }
.dag--band .dag-item--step.is-cached .dag-tab { stroke: #66bb6a; }
.dag--band .dag-item--step.is-blocked .dag-tab { stroke: #ef5350; }
.dag--band.dag--stateless .dag-item--step .dag-tab { stroke: #78909c; }
.dag--blueprint .dag-tab { fill: #eef3fc; stroke: #1f3d8f; stroke-width: 1.5; }
.dag-node--param { fill: #f3e5f5; stroke: #ce93d8; }
.dag-node--file { fill: #efebe9; stroke: #bcaaa4; }
.dag-node--output { fill: #e3f2fd; stroke: #64b5f6; }
