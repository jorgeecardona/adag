<svg xmlns="http://www.w3.org/2000/svg" class="dag dag--blueprint" width="533" height="513" viewBox="0 0 533 513"><style>.dag-canvas { fill: #ffffff; }
.dag--blueprint .dag-canvas { fill: #eef3fc; }
.dag-grid { fill: none; stroke: #cfdaf0; stroke-width: 1; }
