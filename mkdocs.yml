site_name: adag
site_description: "A DAG engine for Python data pipelines with content-addressed caching."
site_url: https://cardona-oss.gitlab.io/adag/
repo_url: https://gitlab.com/cardona-oss/adag
repo_name: cardona-oss/adag
copyright: MIT &copy; Jorge Cardona

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

# docs/issues/ is the follow-up register (`cabildo issues`), read in the repo, not published:
# its links point at source files that are not part of the site, so --strict would fail on them.
exclude_docs: |
  issues/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            heading_level: 3
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            docstring_section_style: spacy
  - llmstxt:
      markdown_description: "A step's cache key is a hash of its fields, its inputs and its source code, so a rerun recomputes only the steps whose key changed and everything downstream of them."
      full_output: llms-full.txt
      sections:
        Usage documentation:
          - index.md
          - comparison.md
          - steps.md
          - inputs.md
          - caching.md
          - cli.md
          - cache-keys.md
          - visualization.md
          - observers.md
          - batch.md
          - fan-out.md
          - loops.md
          - static-and-dynamic.md
          - async-parallel.md
          - dispatch.md
          - cache-stores.md
          - save-load.md
          - migration.md
        API reference:
          - api.md

nav:
  - Home: index.md
  - Why adag: comparison.md
  - Tutorial:
      - Steps and pipelines: steps.md
      - Inputs: inputs.md
      - Caching: caching.md
      - Command line: cli.md
  - Inspect a run:
      - Why a step recomputed: cache-keys.md
      - Visualization: visualization.md
      - Observers: observers.md
  - Scale:
      - Static and dynamic parts: static-and-dynamic.md
      - Batch steps: batch.md
      - Fan-out: fan-out.md
      - Loops: loops.md
      - Async and parallel: async-parallel.md
      - Dispatch: dispatch.md
  - Storage:
      - Cache stores: cache-stores.md
      - Save and load: save-load.md
  - Reference:
      - API reference: api.md
      - Upgrade to 0.3.0: migration.md
      - Changelog: changelog.md
