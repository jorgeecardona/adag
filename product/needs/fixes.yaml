who: developer debugging a pipeline that fails or recomputes unexpectedly

needs:

  - id: FX-1
    text: >
      When a file source points at a directory, the developer can see an error that names the
      source and the path.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "https://gitlab.com/cardona-oss/adag/-/issues/6"}
    proofs:
      - "test:tests/test_file_source.py::test_file_source_on_a_directory_names_the_source"

  - id: FX-2
    text: >
      When the developer asks whether a node is cached, they can get the same answer the resolver
      acts on, including for a step that caches to a path.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "https://gitlab.com/cardona-oss/adag/-/issues/5"}
    proofs:
      - "test:tests/test_path_results.py::test_is_cached_agrees_with_the_resolver_on_an_invalid_entry"

  - id: FX-3
    text: >
      When load_result gives back less than run produced, the developer can see a warning on the
      first save instead of losing the data silently downstream.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "https://gitlab.com/cardona-oss/adag/-/issues/7"}
    proofs:
      - "test:tests/test_path_results.py::test_lossy_round_trip_warns_on_first_save"
      - "test:tests/test_path_results.py::test_faithful_round_trip_does_not_warn"

  - id: FX-4
    text: >
      When the developer puts an upstream node in a step field, they can get an error at wiring
      time that says to pass it as a call input, and no advice that would drop the edge.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "https://gitlab.com/cardona-oss/adag/-/issues/10"}
    proofs:
      - "test:tests/test_step.py::test_step_result_field_is_rejected_when_wired"
      - "test:tests/test_step.py::test_unhashable_graph_node_does_not_suggest_config"

  - id: FX-5
    text: >
      When a job scheduler stops reporting a submitted job, the developer can see the branch fail
      after a few polls and be retried, instead of the run waiting forever.
    sources:
      - {kind: secondary, date: 2026-11-19, locator: "musil model-check of the dispatcher, docs/issues/19-11-2026-a-job-the-backend-leaves-out-of-status-is-polled-forever.md"}
    proofs:
      - "test:tests/test_remote_dispatcher.py::test_a_job_the_backend_never_reports_fails_after_a_few_polls"
      - "test:tests/test_remote_dispatcher.py::test_a_job_the_backend_stopped_reporting_is_retried"

  - id: FX-6
    text: >
      When a branch result is already in the cache, the developer can rerun a dispatched fan-out
      and see the branch finish, even if its own job is queued, failed or timed out.
    sources:
      - {kind: secondary, date: 2026-11-19, locator: "musil model-check of the dispatcher, docs/issues/19-11-2026-the-dispatcher-ignores-the-cache-while-its-own-job-is-live.md"}
    proofs:
      - "test:tests/test_remote_dispatcher.py::test_a_failing_job_succeeds_when_another_process_wrote_the_result"
      - "test:tests/test_remote_dispatcher.py::test_a_queue_timeout_succeeds_when_the_result_is_already_cached"
      - "test:tests/test_remote_dispatcher.py::test_a_result_that_arrives_after_the_failure_is_decided_still_fails"

  - id: FX-7
    text: >
      When fan-out branches each build their own copy of an upstream step, the developer can run
      the fan-out in threads and see that step run once, not once per branch.
    sources:
      - {kind: secondary, date: 2026-11-19, locator: "docs/issues/19-11-2026-in-flight-dedup-is-keyed-by-the-object-id-not-by-the.md"}
    proofs:
      - "test:tests/test_inflight_dedup.py::test_equal_nodes_built_per_branch_run_the_body_once"
      - "test:tests/test_inflight_dedup.py::test_equal_nodes_gathered_on_the_loop_run_the_body_once"

  - id: FX-8
    text: >
      When two writers save the same directory result at once, the developer can rerun the
      pipeline and still load a complete result.
    sources:
      - {kind: secondary, date: 2026-11-19, locator: "musil model-check of the cache write protocol, docs/issues/19-11-2026-overlapping-writers-of-a-directory-result-can-break-each-other.md"}

  - id: FX-9
    text: >
      When a shared upstream step fails, the developer can see its body run once, not once per
      waiting thread.
    sources:
      - {kind: secondary, date: 2026-11-19, locator: "musil model-check of in-flight dedup, docs/issues/19-11-2026-a-failing-body-runs-once-per-waiting-thread.md"}

  - id: FX-10
    text: >
      When two processes save the same key to a SQL store at once, the developer can see both
      succeed.
    sources:
      - {kind: assumption, date: 2026-11-19, locator: "musil model-check of the cache write protocol, docs/issues/19-11-2026-sqlcachestore-set-may-raise-on-two-concurrent-writers.md (unverified on Postgres)"}


  - id: FX-11
    text: >
      When the developer overrides run, arun, items_data, process_item or assemble with named
      parameters, as the docs show, they can run pyright strict with no ignore comment.
    sources:
      - {kind: secondary, date: 2026-11-19, locator: "https://gitlab.com/cardona-oss/adag/-/issues/14"}
    proofs:
      - "test:tests/test_override_typing.py::test_named_parameter_overrides_run"
      - "test:tests/test_override_typing.py::test_named_parameter_override_of_arun"
      - "test:tests/test_override_typing.py::test_named_parameter_overrides_of_the_batch_hooks"

  - id: FX-12
    text: >
      When a step has a field that run, arun or a batch hook does not name, the developer can run
      the step and read the field from self, with the field still part of the cache key.
    sources:
      - {kind: secondary, date: 2026-11-19, locator: "https://gitlab.com/cardona-oss/adag/-/issues/15"}
    proofs:
      - "test:tests/test_unnamed_fields.py::test_a_field_that_run_does_not_name_is_read_from_self"
      - "test:tests/test_unnamed_fields.py::test_the_unnamed_field_still_changes_the_step_key"
      - "test:tests/test_unnamed_fields.py::test_an_async_step_may_leave_a_field_unnamed"
      - "test:tests/test_unnamed_fields.py::test_a_process_step_may_leave_a_field_unnamed"
      - "test:tests/test_unnamed_fields.py::test_the_batch_hooks_may_leave_fields_unnamed"
      - "test:tests/test_unnamed_fields.py::test_item_keys_are_the_same_as_before_the_hooks_were_wrapped"
      - "test:tests/test_unnamed_fields.py::test_validate_names_a_wired_input_that_run_does_not_accept"

  - id: FX-13
    text: >
      When two nodes of one step class have the same cache key, the developer can see the body run
      once and both nodes hand on one object, with or without a store.
    sources:
      - {kind: secondary, date: 2026-11-26, locator: "https://gitlab.com/cardona-oss/adag/-/issues/21"}
    proofs:
      - "test:tests/test_twins.py::test_twins_run_once_and_share_one_result"
      - "test:tests/test_twins.py::test_fan_out_branches_that_build_equal_nodes_run_them_once"
      - "test:tests/test_twins.py::test_two_step_classes_with_one_key_keep_their_own_results"

  - id: FX-14
    text: >
      When a step reads an input that adag cannot hash, the developer can run it with a new value
      and get the result of that value, not one saved for another.
    sources:
      - {kind: secondary, date: 2026-11-26, locator: "found while reviewing https://gitlab.com/cardona-oss/adag/-/issues/21, reproduced on 0.3.49"}
    proofs:
      - "test:tests/test_input_keys.py::test_a_second_run_with_another_value_computes_it"
      - "test:tests/test_input_keys.py::test_a_missing_path_wired_as_an_input_blocks_the_key"
