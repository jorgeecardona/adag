who: developer debugging a pipeline that fails or recomputes unexpectedly

needs:

  - id: FX-1
    text: >
      When a file source points at a directory, the developer can see an error that names the
      source and the path.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "https://gitlab.com/cardona-oss/adag/-/issues/6"}
    proofs:
      - "test:tests/test_file_source.py::test_file_source_on_a_directory_names_the_source"

  - id: FX-2
    text: >
      When the developer asks whether a node is cached, they can get the same answer the resolver
      acts on, including for a step that caches to a path.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "https://gitlab.com/cardona-oss/adag/-/issues/5"}
    proofs:
      - "test:tests/test_path_results.py::test_is_cached_agrees_with_the_resolver_on_an_invalid_entry"

  - id: FX-3
    text: >
      When load_result gives back less than run produced, the developer can see a warning on the
      first save instead of losing the data silently downstream.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "https://gitlab.com/cardona-oss/adag/-/issues/7"}
    proofs:
      - "test:tests/test_path_results.py::test_lossy_round_trip_warns_on_first_save"
      - "test:tests/test_path_results.py::test_faithful_round_trip_does_not_warn"

  - id: FX-4
    text: >
      When the developer puts an upstream node in a step field, they can get an error at wiring
      time that says to pass it as a call input, and no advice that would drop the edge.
    sources:
      - {kind: secondary, date: 2026-11-12, locator: "https://gitlab.com/cardona-oss/adag/-/issues/10"}
    proofs:
      - "test:tests/test_step.py::test_step_result_field_is_rejected_when_wired"
      - "test:tests/test_step.py::test_unhashable_graph_node_does_not_suggest_config"

  - id: FX-5
    text: >
      When a job scheduler stops reporting a submitted job, the developer can see the branch fail
      after a few polls and be retried, instead of the run waiting forever.
    sources:
      - {kind: secondary, date: 2026-11-19, locator: "musil model-check of the dispatcher, docs/issues/19-11-2026-dispatcher-polls-forever-for-an-unreported-job.md"}
    proofs:
      - "test:tests/test_remote_dispatcher.py::test_a_job_the_backend_never_reports_fails_after_a_few_polls"
      - "test:tests/test_remote_dispatcher.py::test_a_job_the_backend_stopped_reporting_is_retried"

  - id: FX-6
    text: >
      When a branch result is already in the cache, the developer can rerun a dispatched fan-out
      and see the branch finish, even if its own job is queued, failed or timed out.
    sources:
      - {kind: secondary, date: 2026-11-19, locator: "musil model-check of the dispatcher, docs/issues/19-11-2026-dispatcher-ignores-the-cache-while-its-job-is-live.md"}
    proofs:
      - "test:tests/test_remote_dispatcher.py::test_a_failing_job_succeeds_when_another_process_wrote_the_result"
      - "test:tests/test_remote_dispatcher.py::test_a_queue_timeout_succeeds_when_the_result_is_already_cached"
      - "test:tests/test_remote_dispatcher.py::test_a_result_that_arrives_after_the_failure_is_decided_still_fails"

  - id: FX-7
    text: >
      When fan-out branches each build their own copy of an upstream step, the developer can run
      the fan-out in threads and see that step run once, not once per branch.
    sources:
      - {kind: secondary, date: 2026-11-19, locator: "docs/issues/19-11-2026-in-flight-dedup-keyed-by-object-id.md"}
    proofs:
      - "test:tests/test_inflight_dedup.py::test_equal_nodes_built_per_branch_run_the_body_once"
      - "test:tests/test_inflight_dedup.py::test_equal_nodes_gathered_on_the_loop_run_the_body_once"
