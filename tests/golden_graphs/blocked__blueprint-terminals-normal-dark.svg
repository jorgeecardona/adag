.dag--blueprint .dag-text--param, .dag--blueprint .dag-text--key { fill: #9db8ff; }
.dag-text--input { fill: #d9a7e3; font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
