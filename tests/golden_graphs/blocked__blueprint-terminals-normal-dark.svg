<svg xmlns="http://www.w3.org/2000/svg" class="dag dag--blueprint" width="282" height="492" viewBox="0 0 282 492">
<style>.dag-canvas { fill: #14161a; }
.dag--blueprint .dag-canvas { fill: #0b1322; }
.dag-grid { fill: none; stroke: #17233b; stroke-width: 1; }
.dag-text { fill: #e6e8eb; font-family: -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif; }
.dag--blueprint .dag-text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
