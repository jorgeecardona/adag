<polygon points="136,277 146,277 141,286" class="dag-arrow" />
<path d="M141 376 L141 431" class="dag-edge dag-edge--output" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,4" />
<polygon points="136,431 146,431 141,440" class="dag-arrow dag-arrow--output" />
<g class="dag-item dag-item--file" data-state="none" data-kind="file" data-name="sales.csv">
