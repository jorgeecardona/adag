.dag--band .dag-item--step .dag-head { fill: #1d2127; stroke: none; }
.dag--band .dag-item--step.is-pending .dag-head { fill: #2a2317; }
.dag--band .dag-item--step.is-leaf .dag-head { fill: #1e2030; }
.dag--band .dag-item--step.is-cached .dag-head { fill: #16261a; }
.dag--band .dag-item--step.is-blocked .dag-head { fill: #2d1a1c; }
.dag--band.dag--stateless .dag-item--step .dag-head { fill: #1d2127; }
.dag--band .dag-item--step .dag-rule { stroke: #6b7683; stroke-width: 2; }
.dag--band .dag-item--step.is-pending .dag-rule { stroke: #b58900; }
.dag--band .dag-item--step.is-leaf .dag-rule { stroke: #6b74a8; }
.dag--band .dag-item--step.is-cached .dag-rule { stroke: #4f9a5b; }
.dag--band .dag-item--step.is-blocked .dag-rule { stroke: #d05a5a; }
.dag--band.dag--stateless .dag-item--step .dag-rule { stroke: #6b7683; }
