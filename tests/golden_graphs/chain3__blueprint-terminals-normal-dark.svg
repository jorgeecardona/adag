<svg xmlns="http://www.w3.org/2000/svg" class="dag dag--blueprint" width="282" height="552" viewBox="0 0 282 552">
<style>
.dag-canvas { fill: var(--adag-canvas, #14161a); }
.dag--blueprint .dag-canvas { fill: var(--adag-paper, #0b1322); }
.dag-grid { fill: none; stroke: var(--adag-grid, #17233b); stroke-width: 1; }
.dag-text { fill: var(--adag-text, #e6e8eb); font-family: var(--adag-font, -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif); }
.dag--blueprint .dag-text, .dag-text--mono { font-family: var(--adag-font-mono, ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace); }
.dag-text--desc, .dag-text--param, .dag-text--key, .dag-text--tab { fill: var(--adag-muted, #a3aab2); }
.dag-text--param, .dag-text--tab, .dag-text--key { font-family: var(--adag-font-mono, ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace); }
.dag--blueprint .dag-text--title, .dag--blueprint .dag-text--desc,
.dag--blueprint .dag-text--param, .dag--blueprint .dag-text--key { fill: var(--adag-ink, #9db8ff); }
.dag-text--input { fill: var(--adag-input-ink, #d9a7e3); font-family: var(--adag-font-mono, ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace); }
.dag--blueprint .dag-text--input { fill: var(--adag-ink, #9db8ff); }
.dag-text--state { fill: var(--st-ink); font-weight: bold; letter-spacing: 0.05em; }
.dag-edge { fill: none; stroke: var(--adag-edge, #8a96a3); }
.dag-arrow { fill: var(--adag-edge, #8a96a3); }
.dag--blueprint .dag-edge { stroke: var(--adag-ink, #9db8ff); }
.dag--blueprint .dag-arrow { fill: var(--adag-ink, #9db8ff); }
.dag-item {
  --st: var(--adag-neutral, #8795a4); --st-ink: var(--adag-muted, #a3aab2); --st-bg: var(--adag-step-bg, #1d2127); --st-border: var(--adag-step-border, #6b7683);
}
.dag-item.is-pending {
  --st: var(--adag-pending, #e3b341); --st-ink: var(--adag-pending-ink, #f0c75a); --st-bg: var(--adag-pending-bg, #2a2317); --st-border: var(--adag-pending-border, #b58900);
}
.dag-item.is-leaf {
  --st-bg: var(--adag-leaf-bg, #1e2030); --st-border: var(--adag-leaf-border, #6b74a8);
}
.dag-item.is-cached {
  --st: var(--adag-cached, #4cc283); --st-ink: var(--adag-cached-ink, #7dd9a5); --st-bg: var(--adag-cached-bg, #16261a); --st-border: var(--adag-cached-border, #4f9a5b);
}
.dag-item.is-blocked {
  --st: var(--adag-blocked, #ef6b63); --st-ink: var(--adag-blocked-ink, #f5918b); --st-bg: var(--adag-blocked-bg, #2d1a1c); --st-border: var(--adag-blocked-border, #d05a5a);
}
.dag--stateless .dag-item {
  --st: var(--adag-neutral, #8795a4); --st-ink: var(--adag-muted, #a3aab2); --st-bg: var(--adag-step-bg, #1d2127); --st-border: var(--adag-step-border, #6b7683);
}
.dag-node { fill: var(--st-bg); stroke: var(--st-border); }
.dag--blueprint .dag-node { fill: var(--adag-paper, #0b1322); stroke: var(--adag-ink, #9db8ff); }
.dag--band .dag-node { fill: var(--adag-card, #1c242d); stroke: var(--st-border); }
.dag-head { fill: var(--st-bg); stroke: none; }
.dag-rule { stroke: var(--st-border); stroke-width: 2; }
.dag--blueprint .dag-rule { stroke: var(--adag-ink, #9db8ff); stroke-width: 1; opacity: 0.55; }
.dag-state { fill: var(--st); stroke: none; }
.dag-tab { fill: var(--adag-card, #1c242d); stroke: var(--st-border); stroke-width: 1.5; }
.dag--blueprint .dag-tab { fill: var(--adag-paper, #0b1322); stroke: var(--adag-ink, #9db8ff); }
.dag-node--param { fill: var(--adag-input-bg, #271c2b); stroke: var(--adag-input-border, #9a63a6); }
.dag-node--file { fill: var(--adag-file-bg, #241f1d); stroke: var(--adag-file-border, #8a7466); }
.dag-node--output { fill: var(--adag-output-bg, #16232e); stroke: var(--adag-output-border, #4a90c4); }
.dag--blueprint .dag-node--param, .dag--blueprint .dag-node--file { fill: var(--adag-paper, #0b1322); stroke: var(--adag-ink, #9db8ff); }
.dag--blueprint .dag-node--output { fill: var(--adag-paper, #0b1322); stroke: var(--adag-ink, #9db8ff); stroke-dasharray: 5 3; }
.dag--band .dag-node--output { fill: var(--adag-card, #1c242d); stroke: var(--adag-edge, #8a96a3); }
.dag-pin { fill: var(--adag-ink, #9db8ff); stroke: none; }
.dag-text--param-node { fill: var(--adag-input-ink, #d9a7e3); }
.dag-text--file { fill: var(--adag-file-ink, #cbb2a3); }
.dag-text--output { fill: var(--adag-output-ink, #9ecbf0); }
.dag--blueprint .dag-text--param-node, .dag--blueprint .dag-text--file,
.dag--blueprint .dag-text--output { fill: var(--adag-ink, #9db8ff); }
.dag--band .dag-text--output { fill: var(--adag-text, #e6e8eb); }
.dag .dag-node.dag-node--mapped { stroke-dasharray: 8 4; stroke: var(--adag-mapped, #c58ad6); }
.dag .dag-node.dag-node--loop { stroke-dasharray: 3 3; stroke: var(--adag-loop, #4db6ac); }
</style>
