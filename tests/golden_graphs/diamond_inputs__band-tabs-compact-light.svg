@supports (--a: 0) {
.dag-canvas { fill: var(--adag-canvas, #ffffff); }
.dag--blueprint .dag-canvas { fill: var(--adag-paper, #eef3fc); }
.dag-grid { fill: none; stroke: var(--adag-grid, #cfdaf0); stroke-width: 1; }
