.dag--classic .dag-item--step .dag-node { fill: var(--st-bg); stroke: var(--st-border); }
.dag--blueprint .dag-node { fill: var(--adag-paper, #0b1322); stroke: var(--adag-ink, #9db8ff); }
.dag--band .dag-item--step .dag-node { fill: var(--adag-card, #1c242d); stroke: var(--st-border); }
