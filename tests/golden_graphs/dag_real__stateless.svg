<svg xmlns="http://www.w3.org/2000/svg" class="dag dag--blueprint dag--stateless" width="260" height="616" viewBox="0 0 260 616">
<style>.dag-canvas { fill: #ffffff; }
.dag--blueprint .dag-canvas { fill: #eef3fc; }
