<svg xmlns="http://www.w3.org/2000/svg" class="dag dag--band dag--compact" width="310" height="454" viewBox="0 0 310 454">
<style>.dag-canvas { fill: #ffffff; }
.dag--blueprint .dag-canvas { fill: #eef3fc; }
.dag-grid { fill: none; stroke: #cfdaf0; stroke-width: 1; }
.dag-text { fill: #333333; font-family: -apple-system, "Segoe UI", system-ui, Helvetica, Arial, sans-serif; }
.dag--blueprint .dag-text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
.dag-text--desc, .dag-text--param, .dag-text--key, .dag-text--tab { fill: #5f6368; }
.dag-text--param, .dag-text--tab, .dag-text--key { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
.dag--blueprint .dag-text--title, .dag--blueprint .dag-text--desc,
.dag--blueprint .dag-text--param, .dag--blueprint .dag-text--key { fill: #1f3d8f; }
.dag-text--input { fill: #7b1fa2; font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
.dag--blueprint .dag-text--input { fill: #1f3d8f; }
.dag-item--step .dag-text--state { fill: #5f6368; font-weight: bold; letter-spacing: 0.05em; }
.dag-item--step.is-pending .dag-text--state { fill: #8a6200; }
.dag-item--step.is-cached .dag-text--state { fill: #1b6b3a; }
.dag-item--step.is-blocked .dag-text--state { fill: #b3261e; }
.dag--stateless .dag-item--step .dag-text--state { fill: #5f6368; }
.dag-edge { fill: none; stroke: #607d8b; }
.dag-arrow { fill: #607d8b; }
.dag--blueprint .dag-edge { stroke: #1f3d8f; }
.dag--blueprint .dag-arrow { fill: #1f3d8f; stroke: #1f3d8f; stroke-width: 1; stroke-linejoin: round; }
.dag--classic .dag-item--step .dag-node { fill: #f6f8fa; stroke: #78909c; }
.dag--classic .dag-item--step.is-pending .dag-node { fill: #fff8e1; stroke: #ffc107; }
.dag--classic .dag-item--step.is-leaf .dag-node { fill: #e8eaf6; stroke: #9fa8da; }
.dag--classic .dag-item--step.is-cached .dag-node { fill: #e8f5e9; stroke: #66bb6a; }
.dag--classic .dag-item--step.is-blocked .dag-node { fill: #ffebee; stroke: #ef5350; }
.dag--classic.dag--stateless .dag-item--step .dag-node { fill: #f6f8fa; stroke: #78909c; }
.dag--blueprint .dag-node { fill: #eef3fc; stroke: #1f3d8f; }
.dag--band .dag-item--step .dag-node { fill: #ffffff; stroke: #78909c; }
.dag--band .dag-item--step.is-pending .dag-node { stroke: #ffc107; }
.dag--band .dag-item--step.is-leaf .dag-node { stroke: #9fa8da; }
.dag--band .dag-item--step.is-cached .dag-node { stroke: #66bb6a; }
.dag--band .dag-item--step.is-blocked .dag-node { stroke: #ef5350; }
.dag--band.dag--stateless .dag-item--step .dag-node { stroke: #78909c; }
.dag--band .dag-item--step .dag-head { fill: #f6f8fa; stroke: none; }
.dag--band .dag-item--step.is-pending .dag-head { fill: #fff8e1; }
.dag--band .dag-item--step.is-leaf .dag-head { fill: #e8eaf6; }
.dag--band .dag-item--step.is-cached .dag-head { fill: #e8f5e9; }
.dag--band .dag-item--step.is-blocked .dag-head { fill: #ffebee; }
.dag--band.dag--stateless .dag-item--step .dag-head { fill: #f6f8fa; }
.dag--band .dag-item--step .dag-rule { stroke: #78909c; stroke-width: 2; }
.dag--band .dag-item--step.is-pending .dag-rule { stroke: #ffc107; }
.dag--band .dag-item--step.is-leaf .dag-rule { stroke: #9fa8da; }
.dag--band .dag-item--step.is-cached .dag-rule { stroke: #66bb6a; }
.dag--band .dag-item--step.is-blocked .dag-rule { stroke: #ef5350; }
.dag--band.dag--stateless .dag-item--step .dag-rule { stroke: #78909c; }
.dag--blueprint .dag-rule { stroke: #1f3d8f; stroke-width: 1; opacity: 0.55; }
.dag-item--step .dag-state { fill: #64748b; stroke: none; }
.dag-item--step.is-pending .dag-state { fill: #c98e00; }
.dag-item--step.is-cached .dag-state { fill: #2a9456; }
.dag-item--step.is-blocked .dag-state { fill: #d0413a; }
.dag--stateless .dag-item--step .dag-state { fill: #64748b; }
