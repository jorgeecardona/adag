<text x="275" y="51" class="dag-text dag-text--title" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="bold">Load</text>
<text x="206" y="47" class="dag-text dag-text--input" font-size="11" text-anchor="end" dominant-baseline="central">path = 'data.csv'</text>
<line x1="208" y1="47" x2="219" y2="47" class="dag-edge" />
</g>
<g class="dag-item dag-item--step is-pending" data-state="pending" data-kind="step" data-name="clean">
<title>Clean (pending)
Normalize the text.
case = 'lower'
key 3b066804f6d1</title>
<rect x="150" y="120" width="110" height="34" rx="8" class="dag-node dag-node--step is-pending" stroke-width="1.5" />
<path d="M150 128 A8 8 0 0 1 158 120 H252 A8 8 0 0 1 260 128 V129 H150 Z" class="dag-head" />
<text x="205" y="141" class="dag-text dag-text--title" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="bold">Clean</text>
<text x="136" y="137" class="dag-text dag-text--input" font-size="11" text-anchor="end" dominant-baseline="central">case = 'lower'</text>
<line x1="138" y1="137" x2="149" y2="137" class="dag-edge" />
</g>
<g class="dag-item dag-item--step is-cached" data-state="cached" data-kind="step" data-name="count">
<title>Count (cached)
Count the rows.
key 6c35493a2b93</title>
<rect x="290" y="120" width="110" height="34" rx="8" class="dag-node dag-node--step is-cached" stroke-width="1.5" />
<path d="M290 128 A8 8 0 0 1 298 120 H392 A8 8 0 0 1 400 128 V129 H290 Z" class="dag-head" />
<text x="345" y="141" class="dag-text dag-text--title" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="bold">Count</text>
</g>
<g class="dag-item dag-item--step is-pending" data-state="pending" data-kind="step" data-name="report">
<title>Report (pending)
Write the summary.
key 845e91831319</title>
<rect x="220" y="210" width="110" height="34" rx="8" class="dag-node dag-node--step is-pending" stroke-width="2" />
<path d="M220 218 A8 8 0 0 1 228 210 H322 A8 8 0 0 1 330 218 V219 H220 Z" class="dag-head" />
<text x="275" y="231" class="dag-text dag-text--title" font-size="14" text-anchor="middle" dominant-baseline="central" font-weight="bold">Report</text>
</g>
<g class="dag-item dag-item--output" data-state="none" data-kind="output">
<title>report.md</title>
<rect x="215" y="300" width="120" height="30" rx="8" class="dag-node dag-node--output" stroke-width="1.5" />
<text x="275" y="315" class="dag-text dag-text--output" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="bold">report.md</text>
</g>
</svg>
