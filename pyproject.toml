[project]
name = "adag"
dynamic = ["version"]  # the single source of truth is __version__ in src/adag/__init__.py (see [tool.hatch.version])
description = "A DAG engine for Python data pipelines with content-addressed caching"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jorge Cardona", email = "jorgeecardona@gmail.com" }]
keywords = ["dag", "pipeline", "cache", "machine-learning", "data-pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12",
    "structlog",
    "typing-extensions>=4.4",
]

[project.scripts]
adag = "adag.cli:main"

[project.optional-dependencies]
sql = ["sqlalchemy>=2.0"]  # SqlCacheStore
redis = ["redis>=5.0"]  # RedisCacheStore
# docs are an *extra* (not a uv dependency-group) so Read the Docs can install them via pip
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-llmstxt>=0.5",
]

[project.urls]
Homepage = "https://gitlab.com/cardona-oss/adag"
Repository = "https://gitlab.com/cardona-oss/adag"
Documentation = "https://cardona-oss.gitlab.io/adag/"
Changelog = "https://gitlab.com/cardona-oss/adag/-/blob/main/CHANGELOG.md"
Issues = "https://gitlab.com/cardona-oss/adag/-/work_items"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version lives as __version__ in the package itself; hatchling reads it (by regex, no import) so
# pyproject and the runtime never disagree. scripts/bump-version rewrites that literal.
path = "src/adag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/adag"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.uv]
# The version is dynamic (hatchling reads __version__ from the file below), so uv must watch it too:
# declaring cache-keys REPLACES uv's defaults, so pyproject.toml is listed explicitly alongside it.
# Without __init__.py here, bumping the version would not trigger an editable reinstall.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/adag/__init__.py" }]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright[nodejs]>=1.1.390",
    "pytest>=8",
    "sqlalchemy>=2.0",
    "prodc>=0.11.4,<0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
# The canonical base ignore list shared across the oss/ libraries. E501 (line length) is handled by
# the formatter; COM812/ISC001 conflict with the formatter; D1/D401 relax docstring presence/mood;
# TRY003/EM101/EM102 allow inline exception messages; CPY001 drops the copyright-header demand;
# PLC0415 allows non-top-level imports; TC001/TC002/TC003 don't force type-only import blocks.
ignore = [
    "E501",
    "COM812",
    "ISC001",
    "D1",
    "D401",
    "TRY003",
    "EM101",
    "EM102",
    "CPY001",
    "PLC0415",
    "TC001",
    "TC002",
    "TC003",
    # adag-specific: Step.run() takes **kwargs resolved from the graph, so Any is the honest type.
    "ANN401",
    # Multi-line docstring summaries are used throughout the imported engine.
    "D205",
    # Modules inside the package read each other's private helpers on purpose.
    "SLF001",
    # Step and Pipeline constructors take many keyword options by design.
    "PLR0913",
    "PLR0917",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "C901",
    # Generic[...] classes still pair with typing_extensions.TypeVar(default=...).
    "UP046",
    "UP040",
    # The engine catches any step failure to record it and re-raise or report it.
    "BLE001",
    "TRY300",
    # Hook and protocol overrides keep the base signature even when an argument is unused.
    "ARG002",
    "ARG004",
    # StepTimeout is public API; renaming it would break callers.
    "N818",
    # Cache paths are built as str and handed to os functions; converting is churn, not a fix.
    "PTH",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests may assert (S101), use magic values (PLR2004), take unused fixtures (ARG), pass Any to typed
# calls (ANN401), and group assertions pytest would otherwise split (PT018).
"tests/**/*.py" = ["S101", "PLR2004", "ARG", "ANN", "PT018", "PT011", "D", "T201", "S108", "RUF043", "RUF059", "RUF009", "N818", "BLE001", "S603", "FBT001"]
# Doc examples are standalone scripts: they print their output and live outside a package.
"docs/examples/**/*.py" = ["T201", "INP001", "D", "ANN", "ARG", "PLR2004", "RUF009"]
# The CLI and the run-tree observer print to stdout on purpose.
"src/adag/cli.py" = ["T201"]
"src/adag/observers.py" = ["T201"]
# SVG layout uses literal pixel and ratio constants; asserts guard layout invariants.
"src/adag/visualization.py" = ["PLR2004", "S101", "FBT001"]
# The worker command is built from our own module name, never from user input.
"src/adag/dispatch.py" = ["S603"]

[tool.ruff.lint.isort]
known-first-party = ["adag"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Modules inside the package share private helpers and ResolveContext internals on purpose
# (same reason as ruff SLF001).
reportPrivateUsage = false
